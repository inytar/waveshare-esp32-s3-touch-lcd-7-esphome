esphome:
  min_version: "2026.1.0"

psram:
  mode: octal
  speed: 120MHz

esp32:
  variant: esp32s3
  flash_size: 8MB
  cpu_frequency: 240MHz
  framework:
    type: esp-idf
    advanced:
      enable_idf_experimental_features: true
      flash_chip: gd

i2c:
  sda: GPIO08
  scl: GPIO09
  scan: True
  id: bus_a

ch422g:
  - id: ch422g_hub

output:
  - platform: gpio
    id: lcdbacklight_output
    pin:
      ch422g: ch422g_hub
      number: 2
      mode:
        output: true
      inverted: false

light:
  - platform: binary
    output: lcdbacklight_output
    id: lcdbacklight
    name: LCD Backlight
    icon: mdi:wall-sconce-flat-outline
    disabled_by_default: true
    restore_mode: ALWAYS_ON
    on_turn_off:
      - script.execute: start_antiburn
    on_turn_on:
      - script.execute: stop_antiburn

script:
  - id: start_antiburn
    then:
      - delay: 5min
      - logger.log: Starting automatic antiburn.
      - switch.turn_on: switch_antiburn
  - id: stop_antiburn
    then:
      - script.stop: start_antiburn
      - switch.turn_off: switch_antiburn

switch:
  - platform: template
    name: Antiburn
    id: switch_antiburn
    icon: mdi:television-shimmer
    optimistic: true
    entity_category: "config"
    disabled_by_default: true
    turn_on_action:
      - logger.log: "Starting Antiburn"
      - if:
          condition: lvgl.is_paused
          then:
            - lvgl.resume:
            - lvgl.widget.redraw:
      - lvgl.pause:
          show_snow: true
    turn_off_action:
      - logger.log: "Stopping Antiburn"
      - if:
          condition: lvgl.is_paused
          then:
            - lvgl.resume:
            - lvgl.widget.redraw:

lvgl:

### Display
display:
  - platform: mipi_rgb
    model: ESP32-S3-TOUCH-LCD-7-800X480
    id: waveshare_display
    update_interval: never
    auto_clear_enabled: false
    # Workaround for issue: https://github.com/esphome/esphome/issues/21379.
    # Whould only be an issue in 2026.10
    enable_pin:
      ch422g: ch422g_hub
      number: 6

### Touchscreen
touchscreen:
  platform: gt911
  id: waveshare_touch
  interrupt_pin: GPIO4
  reset_pin:
    ch422g: ch422g_hub
    number: 1
    mode: OUTPUT
